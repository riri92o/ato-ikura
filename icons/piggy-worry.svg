<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="pigBodyGradWorry" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffe4ea" />
      <stop offset="60%" stop-color="#ffb3c5" />
      <stop offset="100%" stop-color="#f294ab" />
    </linearGradient>
    
    <linearGradient id="pigNoseGradWorry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff99b3" />
      <stop offset="100%" stop-color="#ee6b8b" />
    </linearGradient>
    
    <linearGradient id="coinGradWorry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <!-- 汗マークの水滴グラデーション -->
    <linearGradient id="sweatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <radialGradient id="cheekGradWorry" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff477e" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff477e" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadowWorry" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softShadowWorry)">
    <!-- くるくる尻尾 -->
    <path d="M 152 46 C 166 32, 180 24, 174 14 C 168 4, 154 8, 154 22 C 154 34, 166 40, 168 50" 
          fill="none" stroke="#f07290" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 背中の金のコイン -->
    <g transform="translate(108, 12) rotate(8)">
      <ellipse cx="14" cy="18" rx="14" ry="18" fill="url(#coinGradWorry)" stroke="#d97706" stroke-width="2.5" />
      <ellipse cx="14" cy="18" rx="10" ry="14" fill="none" stroke="#fef3c7" stroke-width="1.8" stroke-dasharray="3 2" />
      <text x="14" y="23" font-size="14" font-weight="900" fill="#78350f" text-anchor="middle" font-family="sans-serif">¥</text>
    </g>

    <!-- 背中のコイン投入口 -->
    <path d="M 104 46 L 138 40" stroke="#701a2d" stroke-width="7" stroke-linecap="round" />

    <!-- 足 -->
    <path d="M 120 125 L 120 148 C 120 154, 134 154, 134 148 L 136 126 Z" fill="#f89cb2" stroke="#4a1521" stroke-width="4" stroke-linejoin="round" />
    <path d="M 144 120 L 144 144 C 144 150, 158 150, 158 144 L 160 114 Z" fill="#f89cb2" stroke="#4a1521" stroke-width="4" stroke-linejoin="round" />
    <path d="M 40 124 L 40 148 C 40 154, 54 154, 54 148 L 56 126 Z" fill="#f89cb2" stroke="#4a1521" stroke-width="4" stroke-linejoin="round" />
    <path d="M 76 124 L 76 148 C 76 154, 90 154, 90 148 L 92 126 Z" fill="#f89cb2" stroke="#4a1521" stroke-width="4" stroke-linejoin="round" />

    <!-- メイン胴体 -->
    <path d="M 42 48 
             C 42 48, 48 30, 56 34
             C 64 38, 76 34, 88 28
             C 98 22, 102 38, 102 38
             C 124 28, 160 36, 168 56
             C 178 78, 176 110, 162 126
             C 150 134, 46 138, 30 120
             C 18 106, 18 78, 28 62
             C 34 52, 42 48, 42 48 Z" 
          fill="url(#pigBodyGradWorry)" stroke="#4a1521" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 耳 -->
    <path d="M 38 52 L 42 30 L 56 38 Z" fill="url(#pigNoseGradWorry)" stroke="#4a1521" stroke-width="4" stroke-linejoin="round" />
    <path d="M 82 32 L 96 20 L 98 42 Z" fill="url(#pigNoseGradWorry)" stroke="#4a1521" stroke-width="4" stroke-linejoin="round" />

    <!-- ほっぺ -->
    <circle cx="36" cy="80" r="12" fill="url(#cheekGradWorry)" />
    <circle cx="86" cy="74" r="12" fill="url(#cheekGradWorry)" />

    <!-- 鼻 -->
    <g transform="translate(46, 70)">
      <ellipse cx="14" cy="12" rx="18" ry="14" fill="url(#pigNoseGradWorry)" stroke="#4a1521" stroke-width="4" />
      <ellipse cx="9" cy="11" rx="3.2" ry="4" fill="#4a1521" />
      <ellipse cx="19" cy="11" rx="3.2" ry="4" fill="#4a1521" />
      <ellipse cx="12" cy="6" rx="5" ry="2" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- 困り眉と目 -->
    <path d="M 38 48 L 47 52" stroke="#4a1521" stroke-width="3" stroke-linecap="round" />
    <path d="M 86 44 L 77 48" stroke="#4a1521" stroke-width="3" stroke-linecap="round" />
    <!-- 目（ちょっと不安そうなつぶらな目） -->
    <circle cx="44" cy="60" r="4.5" fill="#2d1219" />
    <circle cx="42.5" cy="58" r="1.6" fill="#ffffff" />
    <circle cx="80" cy="56" r="4.5" fill="#2d1219" />
    <circle cx="78.5" cy="54" r="1.6" fill="#ffffff" />

    <!-- ちょっぴり波打った口元（〜） -->
    <path d="M 52 98 Q 57 95 61 98 Q 65 101 69 97" fill="none" stroke="#4a1521" stroke-width="3" stroke-linecap="round" />

    <!-- 汗マーク（青く立体的な水滴 💦） -->
    <g transform="translate(20, 24) rotate(-15)">
      <path d="M 12 0 C 12 0, 0 16, 0 24 C 0 31, 5.5 36, 12 36 C 18.5 36, 24 31, 24 24 C 24 16, 12 0, 12 0 Z" 
            fill="url(#sweatGrad)" stroke="#0369a1" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="8" cy="22" rx="3" ry="5" fill="#ffffff" opacity="0.75" />
    </g>
  </g>
</svg>
