<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="あといくら">
  <!-- 背景 -->
  <rect width="512" height="512" rx="118" fill="#dff4e7"/>
  <!-- 飛び出るコイン（ゴールド） -->
  <circle cx="210" cy="180" r="50" fill="#fcd34d" stroke="#f59e0b" stroke-width="10"/>
  <text x="210" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="65" font-weight="900" fill="#d97706" text-anchor="middle">¥</text>
  <!-- 飛び出るお札（グリーン） -->
  <rect x="240" y="120" width="130" height="90" rx="12" fill="#86efac" stroke="#10b981" stroke-width="10" transform="rotate(15 305 165)"/>
  <circle cx="305" cy="165" r="20" fill="#10b981" transform="rotate(15 305 165)"/>
  <!-- 財布本体 -->
  <rect x="100" y="200" width="312" height="220" rx="30" fill="#4f9d73" stroke="#2f7552" stroke-width="12"/>
  <!-- 財布の口（上部折り返し部分） -->
  <path d="M100 230c0-15 15-30 30-30h252c15 0 30 15 30 30v20H100z" fill="#3b7a57" stroke="#2f7552" stroke-width="12"/>
  <!-- フラップ（留め具） -->
  <rect x="310" y="270" width="110" height="60" rx="15" fill="#fcd34d" stroke="#d97706" stroke-width="10"/>
  <!-- フラップのボタン（ゴールド） -->
  <circle cx="345" cy="300" r="12" fill="#d97706"/>
</svg>
